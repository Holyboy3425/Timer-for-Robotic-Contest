<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robotics Contest Timer</title>
  <style>
    /* High contrast setup for big screens */
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #464444;
      color: #e6e2e2;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #Phase-Name {
      font-size: 2.5vw;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #69e1ff;
      margin-bottom: 8px;
    }

    #School-Name {
      font-size: 3vw;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-align: center;
      color: #e6e2e2;
      margin-bottom: 10px;
      font-weight: bold;
    }

    #Real-Time-Clock {
      font-size: 2vw;
      color: #e6e2e2;
      margin-bottom: 20px;
    }

    #Timer-Name {
      font-size: 1.5vw;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #69e1ff;
      margin-bottom: 8px;
    }

    /* Layout coordinates container for numbers + logo */
    .timer-row {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 10px 0;
    }

    #timer-display {
      font-size: 10vw; 
      font-weight: bold;
      font-variant-numeric: tabular-nums; 
      margin: 0;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    .time-block {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .time-val {
      line-height: 1;
    }

    .colon {
      line-height: 1;
      margin: 0 10px;
    }

    .arrow-container {
      display: flex;
      gap: 15px;
      margin-top: 10px;
    }

    .time-adjust-btn {
      background-color: #555;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 1.2vw;
      padding: 4px 12px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .time-adjust-btn:hover {
      background-color: #777;
    }

    /* Display logo in its original aspect ratio, with no cropping */
    #contest-logo {
      position: absolute;
      right: 6vw;
      height: 16vw;          
      width: auto;           
      max-width: 18vw;       
      object-fit: contain;   
    }

    #campus-logo {
      position: absolute;
      left: 6vw;
      height: 20vw;          
      width: auto;           
      max-width: 30vw;       
      object-fit: contain;   
    }

    .warning .time-val { color: #daa410; } 
    .danger .time-val { color: #f44336; }  

    .controls {
      display: flex;
      gap: 20px;
      margin-top: 40px;
      align-items: center;
    }

    button {
      font-size: 2vw;
      padding: 15px 40px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.8; }
    button:active { transform: scale(0.98); }

    #btn-start { background-color: #4CAF50; color: white; }
    #btn-reset { background-color: #e70707; color: white; }

    #btn-arrow {
      background-color: #007bff;
      color: #ffffff;
      font-size: 1.5vw;
      padding: 0;
      width: 3vw;
      height: 3vw;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
    }
    #btn-arrow:hover { background-color: #0056b3; }

    #Next-Team-Footer {
      font-size: 3vw; 
      color: #e6e2e2;
      margin-top: 30px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="Phase-Name">รอบการซ้อมที่ 2</div>
  <div id="School-Name">ทีมปัจจุบัน: โรงเรียนวิทยาศาสตร์พัฒนา</div>
  <div id="Real-Time-Clock">Real Time: <span id="time">00:00:00</span></div>
  <div id="Timer-Name">ระยะเวลาการประกอบหุ่นยนต์เพื่อแข่งขัน</div>
  
  <!-- Row 4: Centered Timer with Custom Action Adjusters -->
  <div class="timer-row">
    <div id="timer-display">
      <div class="time-block">
        <span id="hours-display" class="time-val">00</span>
        <div class="arrow-container">
          <button class="time-adjust-btn" id="hours-up">▲</button>
          <button class="time-adjust-btn" id="hours-down">▼</button>
        </div>
      </div>
      <span class="colon">:</span>
      <div class="time-block">
        <span id="min-display" class="time-val">00</span>
        <div class="arrow-container">
          <button class="time-adjust-btn" id="min-up">▲</button>
          <button class="time-adjust-btn" id="min-down">▼</button>
        </div>
      </div>
      <span class="colon">:</span>
      <div class="time-block">
        <span id="sec-display" class="time-val">00</span>
        <div class="arrow-container">
          <button class="time-adjust-btn" id="sec-up">▲</button>
          <button class="time-adjust-btn" id="sec-down">▼</button>
        </div>
      </div>
    </div>
    <img id="contest-logo" src="logo1.png" alt="Contest Logo" onerror="this.style.display='none';">
    <img id="campus-logo" src="logo2.png" alt="Campus Logo" onerror="this.style.display='none';">
  </div>

  <!-- Row 5: Interaction Controls Panel Grid -->
  <div class="controls">
    <button id="btn-arrow">↑</button>
    <button id="btn-start">Start</button>
    <button id="btn-reset">Reset</button>
  </div>

  <!-- Row 6: Replaced Footer Information Display (Show only next team) -->
  <div id="Next-Team-Footer">ทีมถัดไป: โรงเรียนรุ่งอรุณศึกษา</div>

  <script>
    // รายชื่อโรงเรียน (สามารถเคลียร์ให้เป็น [] เพื่อทดสอบคำว่า "ไม่จัดคิว" ได้ครับ)
    const schools = [
      "โรงเรียนสามโคก",
      "โรงเรียนนนทบุรีวิทยาลัย",
      "โรงเรียนทวารวดี",
      "โรงเรียนเทศบาลบ้านม่วง",
      "โรงเรียนเทศบาลท่าโขลง ๑",
      "โรงเรียนรัชตวิทยาคม",
      "โรงเรียนบ้านปล่องเหลี่ยม",
      "โรงเรียนเทศบาล ๔ วัดบำรุงธรรม",
      "โรงเรียนวัดป่าคาเจริญวิทยา",
      "โรงเรียนสาธิตพหลโยธินรามินทร์ภักดี (เทศบาลเมืองราชบุรี)",
      "โรงเรียนสหศึกษาบางบัวทอง",
      "โรงเรียนสาธิตเทศบาลบ้านหัวหิน",
      "โรงเรียนองค์การบริหารส่วนจังหวัดชัยนาท"
    ];

    // Execution States
    let timeRemaining = 0; 
    let endTime = null;
    let timerInterval = null;
    let isRunning = false;

    // DOM References
    const mainDisplay = document.getElementById('timer-display');
    const hoursDisplay = document.getElementById('hours-display');
    const minDisplay = document.getElementById('min-display');
    const secDisplay = document.getElementById('sec-display');
    const startBtn = document.getElementById('btn-start');
    const resetBtn = document.getElementById('btn-reset');
    const arrowBtn = document.getElementById('btn-arrow'); 
    const schoolDisplay = document.getElementById('School-Name'); 
    const nextTeamFooter = document.getElementById('Next-Team-Footer');
    const timeDisplay = document.getElementById('time');

    // Update School Queue Strings with "ไม่จัดคิว" fallback
    function updateSchoolDisplay() {
      const currentSchool = schools[0] || "ไม่จัดคิว";
      const nextSchool = schools[1] || "ไม่จัดคิว";

      schoolDisplay.textContent = `ทีมปัจจุบัน: ${currentSchool}`;
      nextTeamFooter.textContent = `ทีมถัดไป: ${nextSchool}`;
    }
    updateSchoolDisplay();

    // 1. Clock Tracker
    function runRealTimeClock() {
      const now = new Date();
      const hours = now.getHours().toString().padStart(2, '0');
      const minutes = now.getMinutes().toString().padStart(2, '0');
      const seconds = now.getSeconds().toString().padStart(2, '0');
      timeDisplay.textContent = `${hours}:${minutes}:${seconds}`;
    }
    runRealTimeClock();
    setInterval(runRealTimeClock, 1000);

    // 2. Queue Rotation Functions (Forward and Backward)
    function rotateQueueForward() {
      if (schools.length > 1) {
        const currentSchool = schools.shift();
        schools.push(currentSchool);
        updateSchoolDisplay();
      }
    }

    function rotateQueueBackward() {
      if (schools.length > 1) {
        const lastSchool = schools.pop();
        schools.unshift(lastSchool);
        updateSchoolDisplay();
      }
    }

    // Click blue button goes forward
    arrowBtn.addEventListener('click', rotateQueueForward);

    // 3. Formatting Updates
    function updateDisplay() {
      let totalSeconds = Math.floor(timeRemaining / 1000);
      
      const h = Math.floor(totalSeconds / 3600).toString().padStart(2, '0');
      const m = Math.floor((totalSeconds % 3600) / 60).toString().padStart(2, '0');
      const s = (totalSeconds % 60).toString().padStart(2, '0');

      hoursDisplay.textContent = h;
      minDisplay.textContent = m;
      secDisplay.textContent = s;
      
      mainDisplay.classList.remove('warning', 'danger');
      if (totalSeconds <= 10 && timeRemaining > 0) {
        mainDisplay.classList.add('danger');
      } else if (totalSeconds <= 30 && timeRemaining > 0) {
        mainDisplay.classList.add('warning');
      }
    }

    // Helper to toggle start/pause visual appearance
    function setStartButtonState(running) {
      if (running) {
        startBtn.textContent = 'Pause';
        startBtn.style.backgroundColor = '#FF9800';
      } else {
        startBtn.textContent = 'Start';
        startBtn.style.backgroundColor = '#4CAF50';
      }
    }

    // 4. Synthesized Mechanical Ringing Bell
    function playContestBuzzer() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();
        
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        oscillator.type = 'triangle'; 
        oscillator.frequency.value = 800; 

        const duration = 2.0; 
        const startTime = audioCtx.currentTime;

        for (let i = 0; i < duration * 15; i++) {
          let strikeTime = startTime + (i / 15);
          gainNode.gain.setValueAtTime(0, strikeTime);
          gainNode.gain.linearRampToValueAtTime(0.8, strikeTime + 0.01);
          gainNode.gain.linearRampToValueAtTime(0, strikeTime + 0.05);
        }

        oscillator.start(startTime);
        oscillator.stop(startTime + duration);

      } catch (e) {
        console.error(e);
      }
    }

    // 5. High Frequency Processing Tick Engine
    function tick() {
      timeRemaining = endTime - Date.now();

      if (timeRemaining <= 0) {
        timeRemaining = 0;
        clearInterval(timerInterval);
        isRunning = false;
        setStartButtonState(false);
        playContestBuzzer();
      }
      updateDisplay();
    }

    // 6. Action Toggles
    function toggleTimer() {
      if (!isRunning && timeRemaining > 0) {
        isRunning = true;
        setStartButtonState(true);
        endTime = Date.now() + timeRemaining;
        timerInterval = setInterval(tick, 10); 
      } else if (isRunning) {
        isRunning = false;
        setStartButtonState(false);
        clearInterval(timerInterval);
      }
    }

    startBtn.addEventListener('click', toggleTimer);

    resetBtn.addEventListener('click', () => {
      isRunning = false;
      clearInterval(timerInterval);
      setStartButtonState(false);
      timeRemaining = 0; 
      updateDisplay();
    });

    // Up and Down Adjustment Buttons
    document.getElementById('hours-up').addEventListener('click', () => {
      if (!isRunning) { timeRemaining += 3600 * 1000; updateDisplay(); }
    });
    document.getElementById('hours-down').addEventListener('click', () => {
      if (!isRunning) { timeRemaining = Math.max(0, timeRemaining - 3600 * 1000); updateDisplay(); }
    });
    document.getElementById('min-up').addEventListener('click', () => {
      if (!isRunning) { timeRemaining += 60 * 1000; updateDisplay(); }
    });
    document.getElementById('min-down').addEventListener('click', () => {
      if (!isRunning) { timeRemaining = Math.max(0, timeRemaining - 60 * 1000); updateDisplay(); }
    });
    document.getElementById('sec-up').addEventListener('click', () => {
      if (!isRunning) { timeRemaining += 1000; updateDisplay(); }
    });
    document.getElementById('sec-down').addEventListener('click', () => {
      if (!isRunning) { timeRemaining = Math.max(0, timeRemaining - 1000); updateDisplay(); }
    });

    // 7. Keyboard Control Listeners (Spacebar & Arrow keys)
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault(); 
        toggleTimer();      
      } else if (e.code === 'ArrowUp') {
        e.preventDefault(); // กันหน้าจอสกรอลล์ขึ้น
        rotateQueueForward();
      } else if (e.code === 'ArrowDown') {
        e.preventDefault(); // กันหน้าจอสกรอลล์ลง
        rotateQueueBackward();
      }
    });

    updateDisplay();
  </script>
</body>
</html>
